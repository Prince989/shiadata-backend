# Dedicated Mongo + Redis for shiadata-backend, on non-default ports.
#
# This machine already runs generic "c-mongo" (27017) and "redis-c" (6379)
# containers for other projects, standalone (no replica set). Rather than
# reconfigure shared infrastructure this backend doesn't own, these compose
# services are separate and additive: Mongo here is a single-node replica set
# (required for Mongoose transactions -- refresh-token rotation uses one),
# and both bind to different host ports so nothing on this machine collides.

services:
  mongo:
    image: mongo:8
    container_name: shiadata-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

  redis:
    image: redis:7-alpine
    container_name: shiadata-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
